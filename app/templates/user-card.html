{% extends 'base.html' %}
{% load static %}
{% load widget_tweaks %}

{% block css %}
    <link rel="stylesheet" href="{% static 'css/checkout.css' %}"/>
{% endblock css %}

{% block js %}
    <script src="https://js.stripe.com/v3/"></script>
    <script> var stripe = Stripe('{{STRIPE_PUBLIC_KEY}}'); </script>
    <script src="{% static 'js/stripe.js' %}"></script>
{% endblock js %}

{% block page %}
    <div class="row">
        <div class="col-md-3"></div>
        <div class="col-md-5"><br>
            <div class="card shadow">
                <div class="card-body">
                    {% if card %}
                        <div style="padding: 5px 30px;">
                            <label class="custom-control-label">Current card number: **** ****
                                **** {{ card.last4 }}
                                <span>Exp: {{ card.exp_month }}/{{ card.exp_year }}</span>
                            </label>
                        </div>
                    {% endif %}
                    <form method="post" class="stripe-form" id="stripe-form" data-mode="setup"
                          data-client-secret="{{ client_secret }}">
                        {% csrf_token %}
                        <br>
                        <div class="new-card-form">
                            <div class="stripe-form-row" id="creditCard">
                                <label for="card-element" id="stripeBtnLabel">
                                    Change card info
                                </label>
                                <div id="card-element"></div>
                            </div>
                            <div class="stripe-form-row d-grid gap-2">
                                <button type="submit" id="stripeBtn" class="btn btn-palegreen">Add card</button>
                            </div>
                            <div id="card-errors" role="alert"></div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-4"></div>
    </div>
{% endblock %}
