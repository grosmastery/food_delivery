{% extends "base.html" %}


{% block page %}
    <div class="container">
        <!--Block Popular Items-->
        <section class="section">
            <h1 class="section-title">Most popular</h1>
            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">
                {% for product in items_rating %}
                    <div class="col">
                        {% include 'includes/product-card.html' %}
                    </div>
                {% endfor %}
            </div>
        </section>
        <!--END Block Popular Items-->

        <!--Block Categories-->
        <section class="section">
            <h1 class="section-title">Categories</h1>
            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
                {% for category in context_category %}
                    <div class="col">
                        {% include 'includes/category-card.html' %}
                    </div>
                {% endfor %}
            </div>
        </section>
        <!--END Block Categories-->
    </div>
{% endblock %}
