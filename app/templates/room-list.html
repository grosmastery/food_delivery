{% extends 'base.html' %}
{% load bootstrap_icons %}

{% block page %}
    <div class="container" style="max-width: 720px">
        <h1 class="section-title">Tech Support</h1>
        <div class="d-grid gap-3">
            {% for room in object_list %}
                <a href="/tech-support/{{ room.id }}/" class="card room-link">
                    <span>{% bs_icon 'chat-dots' %} {{ room }}</span>
                    {% bs_icon 'chevron-right' %}
                </a>
            {% empty %}
                <div class="card empty-state">No support rooms yet.</div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
